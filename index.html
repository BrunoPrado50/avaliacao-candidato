<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Galáctico | Recrutamento</title>
    <!-- Fonte futurista do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Caças TIE animados no fundo -->
    <div class="tie-fighter tie-1"></div>
    <div class="tie-fighter tie-2"></div>
    <div class="tie-fighter tie-3"></div>

    <main class="glass-container">
        <div class="header-neon">
            <h1>RECRUTAMENTO IMPERIAL</h1>
            <p class="subtitle">Esquadrão Stormtrooper</p>
            <div class="neon-line"></div>
        </div>

        <form id="formRecrutamento" autocomplete="off">
            <div class="input-group">
                <input type="text" id="nome" required placeholder=" ">
                <label for="nome">Nome do Recruta</label>
            </div>
            
            <div class="input-group">
                <input type="number" id="idade" required min="1" placeholder=" ">
                <label for="idade">Ciclos de Vida (Idade)</label>
            </div>
            
            <div class="input-group">
                <input type="number" id="altura" step="0.01" required min="0.5" placeholder=" ">
                <label for="altura">Estatura (ex: 1.75)</label>
            </div>
            
            <button type="submit" class="btn-neon">VALIDAR CREDENCIAIS</button>
        </form>
    </main>

    <!-- Modal (Popup) -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content glass-container">
            <h2 id="modalTitle">Status da Vaga</h2>
            <p id="modalMessage"></p>
            <button id="btnFecharModal" class="btn-neon outline">ENTENDIDO</button>
        </div>
    </div>

    <!-- Estrutura para os efeitos sonoros otimizados (.ogg) -->
    <audio id="somImpacto" src="clash.ogg" preload="auto"></audio>
    <audio id="somFundo" src="saber-hum.ogg" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
